<!DOCTYPE html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portofolio Traya Putra — Web Developer & UI Engineer. Membangun antarmuka web yang cepat, rapi, dan mudah dipakai."
    />
    <meta name="author" content="Traya Putra" />
    <meta name="theme-color" content="#0b0f19" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Traya Putra — Web Developer & UI Engineer" />
    <meta
      property="og:description"
      content="Portofolio pribadi: proyek, keahlian, dan pengalaman membangun produk web. Dibangun dengan React + TypeScript."
    />

    <title>Traya Putra — Web Developer &amp; UI Engineer</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Terapkan tema tersimpan sebelum paint agar tidak ada "flash" warna.
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          document.documentElement.dataset.theme = saved === "light" ? "light" : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
